name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
      - run: uv sync --frozen --extra cpu --group dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check src examples scripts evaluation tests
      - run: uv run --no-sync ruff format --check src examples scripts evaluation tests
      - run: uv run --no-sync pytest --cov=scenescout --cov-report=term-missing --cov-fail-under=80
      - run: uv run --no-sync python -m compileall -q src examples scripts evaluation
      - run: node --check src/scenescout/static/app.js
      - run: npx --yes prettier@3.9.10 --check "src/scenescout/static/*.{js,css,html}"
      - run: uv build
