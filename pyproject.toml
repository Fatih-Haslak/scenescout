[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scenescout"
version = "0.1.0"
description = "Find the moment you remember. Local visual video search with EmbeddingGemma 2."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Fatih Haslak" }]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "python-multipart>=0.0.20,<1",
  "numpy>=2.2,<3", "pillow>=11,<13", "opencv-python-headless>=4.11,<6",
  "sentence-transformers==6.1.0", "transformers==5.19.0",
  "torch==2.14.1", "torchvision==0.29.1",
]

[project.scripts]
scenescout = "scenescout.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scenescout"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
